<div class="user-profile-container">
    <!-- Profil informacije -->
    <div class="profile-info">
      <h2>Korisnički profil</h2>
  
      <mat-form-field class="full-width">
        <mat-label>Ime i Prezime</mat-label>
        <input matInput  [value]="registerUser?.name +' '+ registerUser?.surname"  readonly />
      </mat-form-field>
  
      <mat-form-field class="full-width">
        <mat-label>Email</mat-label>
        <input matInput [value]="registerUser?.email"  readonly />
      </mat-form-field>
  
      <mat-form-field class="full-width">
        <mat-label>Adresa</mat-label>
        <input matInput [value]="registerUser?.adress"  readonly />
      </mat-form-field>
  
      <mat-form-field class="full-width">
        <mat-label>Broj pratilaca</mat-label>
        <input matInput  readonly />
      </mat-form-field>
  
      <!-- Sekcija za lozinku sa mogućnošću izmene -->
      <div class="password-section">
        <mat-form-field class="full-width">
          <mat-label>Lozinka</mat-label>
          <input matInput [value]="registerUser?.password" type="password" readonly />
          <button mat-button color="primary" (click)="toggleEditPassword()">Izmeni</button>
        </mat-form-field>
  
        <div *ngIf="isEditingPassword">
          <mat-form-field class="full-width">
            <mat-label>Nova lozinka</mat-label>
            <input matInput type="password" placeholder="Unesite novu lozinku" [(ngModel)]="newPassword"  />
          </mat-form-field>
  
          <mat-form-field class="full-width">
            <mat-label>Potvrdite novu lozinku</mat-label>
            <input matInput type="password" placeholder="Ponovo unesite novu lozinku" [(ngModel)]="confirmPassword"/>
          </mat-form-field>
  
          <button mat-raised-button color="primary" (click)="confirmPasswordChange()">Potvrdi</button>
        </div>
      </div>
    </div>
    
    <!-- Tabele pratilaca i praćenih naloga -->
    
    </div>

    <div class="follow-tables">
        <mat-card class="table-card">
          <h3>Pratioci</h3>
          <table mat-table  class="mat-elevation-z8">
            <!-- Kolone tabele -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef> Ime </th>
              <td mat-cell *matCellDef="let follower"> {{ follower.name }} </td>
            </ng-container>
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef> Email </th>
              <td mat-cell *matCellDef="let follower"> {{ follower.email }} </td>
            </ng-container>
    
            <tr mat-header-row *matHeaderRowDef="['name', 'email']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['name', 'email']"></tr>
          </table>
        </mat-card>
    
        <mat-card class="table-card">
          <h3>Praćeni nalozi</h3>
          <table mat-table class="mat-elevation-z8">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef> Ime </th>
              <td mat-cell *matCellDef="let follow"> {{ follow.name }} </td>
            </ng-container>
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef> Email </th>
              <td mat-cell *matCellDef="let follow"> {{ follow.email }} </td>
            </ng-container>
    
            <tr mat-header-row *matHeaderRowDef="['name', 'email']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['name', 'email']"></tr>
          </table>
        </mat-card>
      </div>
    
      <!-- Sekcija za prikaz objava korisnika -->
      <div class="user-posts">
        <h3>Vaše objave</h3>
        <!-- <div *ngFor="let post of userPosts" class="post-card"> -->
          <div class="post-card"></div>
          <mat-card>
            <mat-card-title> <!--{{ post.title }}--></mat-card-title>
            <mat-card-content>
             <!--{{ post.content }}--> 
            </mat-card-content>
          </mat-card>
        </div>
